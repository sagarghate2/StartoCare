server:
  port: 0

spring:
  kafka:
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

app:
  kafka:
    enabled: false
    topics:
      payment-succeeded: payment.succeeded.test
      companion-location-request: companion.location.requested.test
      companion-location-response: companion.location.response.test
  companion-api-key: test-internal-api-key
  geoapify:
    api-key: ""
  jwt:
    secret: ${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
