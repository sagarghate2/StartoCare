server:
  port: ${PORT:8085}

spring:
  application:
    name: startocare-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: startocare-notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      payment-requested: ${KAFKA_PAYMENT_REQUESTED_TOPIC:payment.requested}
      payment-succeeded: ${KAFKA_PAYMENT_SUCCEEDED_TOPIC:payment.succeeded}
      booking-created: ${KAFKA_BOOKING_CREATED_TOPIC:booking.created}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  sns:
    enabled: ${AWS_SNS_ENABLED:true}
    payment-topic-arn: ${SNS_PAYMENT_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:startocare-payment-notifications}
    booking-topic-arn: ${SNS_BOOKING_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:startocare-booking-notifications}
  sqs:
    enabled: ${AWS_SQS_ENABLED:true}
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/startocare-notifications}
